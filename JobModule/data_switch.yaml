# Command Templates
cmd_templates:
  init: '*RST'  # Reset command (modify based on your switch)
  on: 'A'       # RELAY ON
  off: 'a'      # RELAY OFF
  stop: 'ABORT' # Stop command

# Basic Configuration
arg_configs:
  duration: 2.0     # 2 seconds duration
  operation: 'on'   # Default operation

# RS232 Setup Parameters
arg_setups:
  baud_rate: 9600
  data_bits: 8
  parity: 'none'
  stop_bits: 1
